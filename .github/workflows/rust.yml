name: Build

on:
  push:
    branches: [ "*" ]
    # rust-v1.2.3 publishes a release (paths are not checked for tags)
    tags: [ "rust-v*" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test:

    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; it also builds and tests for Intel (universal app)
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust
      run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      if: matrix.os == 'ubuntu-latest'
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Test
      run: cargo test

    # the Intel half of the universal app, run through Rosetta
    - name: Test for Intel Macs
      if: runner.os == 'macOS'
      run: |
        /usr/sbin/softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
        rustup target add x86_64-apple-darwin
        cargo test --target x86_64-apple-darwin

    - name: Build release
      if: runner.os != 'macOS'
      run: cargo build --release

    - name: Build universal macOS app
      if: runner.os == 'macOS'
      run: |
        mkdir -p dist
        packaging/macos/bundle.sh dist/teddy-rust-macos-universal.dmg

    # archives keep the executable bit, which artifacts would lose
    - name: Package
      if: runner.os != 'macOS'
      shell: bash
      run: |
        name="teddy-rust-$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')-$(echo '${{ runner.arch }}' | tr '[:upper:]' '[:lower:]')"
        mkdir -p "dist/$name"
        cp README.md teddy/LICENSES.txt "dist/$name/"
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp target/release/teddy.exe target/release/teddybench.exe "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
        else
          cp target/release/teddy target/release/teddybench "dist/$name/"
          # menu entry with icon, installed by install-desktop-entry.sh
          cp packaging/linux/teddybench.desktop packaging/linux/install-desktop-entry.sh "dist/$name/"
          cp teddybench/assets/custom.png "dist/$name/teddybench.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
        fi
        rm -rf "dist/$name"
        ls -la dist

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: teddy-rust-${{ runner.os }}-${{ runner.arch }}
        path: dist/*
        if-no-files-found: error

  release:

    needs: test
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: teddy-rust-*
        merge-multiple: true

    # the section of the version from CHANGELOG.md, then the downloads
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        awk -v v="${TAG#rust-v}" '$1 == "##" { f = ($2 == v); next } f' CHANGELOG.md > notes.md
        # every version section has these headings, also when one only says "None."
        for heading in "### New" "### Fixed and improved" "### Notes"; do
          grep -qx "$heading" notes.md || { echo "::error::CHANGELOG.md: section ${TAG#rust-v} has no '$heading'"; exit 1; }
        done
        cat >> notes.md <<NOTES

        ### Downloads

        Built from \`${GITHUB_SHA::7}\`.

        | File | Platform |
        |---|---|
        | \`teddy-rust-windows-x64.zip\` | Windows (64 bit) |
        | \`teddy-rust-macos-universal.dmg\` | macOS 11 or later, Apple Silicon and Intel |
        | \`teddy-rust-linux-x64.tar.gz\` | Linux (x86-64, needs ALSA for playback); \`./install-desktop-entry.sh\` adds it to the application menu |

        Each download contains TeddyBench (GUI) and \`teddy\` (command line). See the README inside.
        On macOS, drag TeddyBench.app into Applications. The macOS app is not signed with an Apple Developer ID:
        the first time, right-click it → Open, or run \`xattr -dr com.apple.quarantine /Applications/TeddyBench.app\`.
        NOTES
        gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "TeddyBench ${TAG#rust-v}" --notes-file notes.md --latest --verify-tag
