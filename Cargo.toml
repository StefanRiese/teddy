[workspace]
resolver = "2"
members = ["tonie-core", "teddy", "teddybench"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/StefanRiese/teddy"

[profile.release]
lto = "thin"

# keep target/ small: no debug info for dependencies, line tables only for our crates
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
