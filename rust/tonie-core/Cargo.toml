[package]
name = "tonie-core"
description = "Reading and writing Toniebox audio files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
id3 = "1.17.2"
ogg = "0.9.2"
opus = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "wav", "flac", "pcm"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
